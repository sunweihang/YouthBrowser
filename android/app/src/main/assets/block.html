<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>访问被拦截</title>
  <style>
    :root {
      --bg: #0f1724;
      --panel: #1a2740;
      --text: #e7eef9;
      --muted: #93a4bb;
      --accent: #5b9cff;
      --line: #2c3f5c;
      --ok: #3caf7a;
      --danger: #e25b5b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #243b2e 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }
    .panel {
      width: min(560px, 100%);
      padding: 36px 32px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(26, 39, 64, 0.92);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .msg {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 15px;
    }
    .meta {
      margin: 0 0 24px;
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 10px 12px;
      font-size: 13px;
    }
    .meta dt { color: var(--muted); }
    .meta dd { margin: 0; word-break: break-all; color: var(--text); }
    .hidden { display: none !important; }
    button.primary {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px 16px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }
    button.primary:disabled { opacity: 0.6; }
    .status { margin-top: 12px; font-size: 13px; color: var(--accent); min-height: 1.2em; }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--ok); }
  </style>
</head>
<body>
  <main class="panel">
    <h1>此页面不可访问</h1>
    <p class="msg" id="message">未授权的网站或内容</p>
    <dl class="meta">
      <dt>地址</dt>
      <dd id="url">—</dd>
      <dt>原因</dt>
      <dd id="reason">—</dd>
    </dl>
    <div id="applyWrap" class="hidden">
      <button type="button" class="primary" id="applyBtn">申请访问</button>
      <p class="status" id="applyStatus"></p>
    </div>
  </main>
  <script>
    var reasonMap = {
      invalid_url: '无效地址',
      host_denied: '网站不在白名单',
      bili_path_denied: 'B 站路径未授权',
      bili_up_denied: '该 UP 主不在允许列表',
      bili_resolve_failed: '无法确认视频作者',
      protocol_denied: '协议不被允许'
    };
    function param(name) {
      try {
        var q = location.search.substring(1).split('&');
        for (var i = 0; i < q.length; i++) {
          var p = q[i].split('=');
          if (decodeURIComponent(p[0]) === name) {
            return decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
          }
        }
      } catch (e) {}
      return '';
    }
    function normalizeHttpUrl(url) {
      var s = String(url || '').trim();
      if (!s) return '';
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) return s;
      return 'https://' + s;
    }
    function isHttpUrl(url) {
      try {
        var u = new URL(normalizeHttpUrl(url));
        return u.protocol === 'http:' || u.protocol === 'https:';
      } catch (e) {
        return false;
      }
    }
    var originalUrl = param('url') || '';
    var reason = param('reason') || '';
    var message = param('message') || '未授权的网站或内容';
    var mid = param('mid') || '';
    var bvid = param('bvid') || '';
    var aid = param('aid') || '';
    var title = param('title') || '';
    document.getElementById('url').textContent = originalUrl || '—';
    document.getElementById('reason').textContent = reasonMap[reason] || reason || '—';
    document.getElementById('message').textContent = message;
    var welcome = originalUrl === '(未打开页面)';
    if (welcome) {
      document.querySelector('h1').textContent = '欢迎使用';
      document.getElementById('url').parentNode.style.display = 'none';
      document.querySelector('dt').style.display = 'none';
    }
    var canApply = !welcome && isHttpUrl(originalUrl) && reason !== 'invalid_url' && reason !== 'protocol_denied';
    if (canApply) document.getElementById('applyWrap').classList.remove('hidden');
    document.getElementById('applyBtn').addEventListener('click', function () {
      var btn = document.getElementById('applyBtn');
      var status = document.getElementById('applyStatus');
      btn.disabled = true;
      status.className = 'status';
      status.textContent = '正在提交…';
      try {
        if (window.JianXing && window.JianXing.requestAccess) {
          var result = window.JianXing.requestAccess(
            normalizeHttpUrl(originalUrl), reason, mid, bvid, aid, title
          );
          status.className = 'status ok';
          status.textContent = result || '已提交申请';
          btn.textContent = '已申请';
        } else {
          status.className = 'status err';
          status.textContent = '当前环境无法发起申请';
          btn.disabled = false;
        }
      } catch (e) {
        status.className = 'status err';
        status.textContent = '提交失败：' + (e && e.message ? e.message : e);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
