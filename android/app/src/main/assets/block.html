<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>访问被拦截</title>
  <style>
    :root {
      --bg: #f3f6f4;
      --card: #ffffff;
      --text: #1a2420;
      --muted: #5c6b64;
      --primary: #1b6b4a;
      --accent: #e8a317;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      background: linear-gradient(165deg, #e8f0ec 0%, var(--bg) 45%, #eef2f0 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .panel {
      width: min(440px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 8px 28px rgba(15, 74, 50, 0.08);
    }
    .brand {
      color: var(--primary);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0 0 8px;
      font-size: 14px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.3;
    }
    .msg {
      color: var(--muted);
      margin: 0 0 20px;
      line-height: 1.5;
    }
    dl.meta {
      margin: 0 0 20px;
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 8px 12px;
      font-size: 13px;
    }
    dt { color: var(--muted); }
    dd { margin: 0; word-break: break-all; }
    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 0 0 12px;
    }
    .hidden { display: none !important; }
    button.primary {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px 16px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:disabled {
      opacity: 0.6;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--primary);
      min-height: 1.2em;
    }
    .status.err { color: #c62828; }
    .status.ok { color: var(--primary); }
  </style>
</head>
<body>
  <main class="panel">
    <p class="brand">简行浏览器</p>
    <h1>此页面不可访问</h1>
    <p class="msg" id="message">未授权的网站或内容</p>
    <dl class="meta">
      <dt>地址</dt>
      <dd id="url">—</dd>
      <dt>原因</dt>
      <dd id="reason">—</dd>
    </dl>
    <div id="applyWrap" class="hidden">
      <button type="button" class="primary" id="applyBtn">申请访问</button>
      <p class="status" id="applyStatus"></p>
    </div>
  </main>
  <script>
    var reasonMap = {
      invalid_url: '无效地址',
      host_denied: '网站不在白名单',
      bili_path_denied: 'B 站路径未授权',
      bili_up_denied: '该 UP 主不在允许列表',
      bili_resolve_failed: '无法确认视频作者',
      protocol_denied: '协议不被允许'
    };
    function param(name) {
      try {
        var q = location.search.substring(1).split('&');
        for (var i = 0; i < q.length; i++) {
          var p = q[i].split('=');
          if (decodeURIComponent(p[0]) === name) {
            return decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
          }
        }
      } catch (e) {}
      return '';
    }
    function normalizeHttpUrl(url) {
      var s = String(url || '').trim();
      if (!s) return '';
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) return s;
      return 'https://' + s;
    }
    function isHttpUrl(url) {
      try {
        var u = new URL(normalizeHttpUrl(url));
        return u.protocol === 'http:' || u.protocol === 'https:';
      } catch (e) {
        return false;
      }
    }
    var originalUrl = param('url') || '';
    var reason = param('reason') || '';
    var message = param('message') || '未授权的网站或内容';
    var mid = param('mid') || '';
    var bvid = param('bvid') || '';
    var aid = param('aid') || '';
    var title = param('title') || '';
    document.getElementById('url').textContent = originalUrl || '—';
    document.getElementById('reason').textContent = reasonMap[reason] || reason || '—';
    document.getElementById('message').textContent = message;

    var canApply = isHttpUrl(originalUrl) && reason !== 'invalid_url' && reason !== 'protocol_denied';
    if (canApply) {
      document.getElementById('applyWrap').classList.remove('hidden');
    }

    document.getElementById('applyBtn').addEventListener('click', function () {
      var btn = document.getElementById('applyBtn');
      var status = document.getElementById('applyStatus');
      btn.disabled = true;
      status.className = 'status';
      status.textContent = '正在提交…';
      try {
        if (window.JianXing && window.JianXing.requestAccess) {
          var result = window.JianXing.requestAccess(
            normalizeHttpUrl(originalUrl), reason, mid, bvid, aid, title
          );
          status.className = 'status ok';
          status.textContent = result || '已提交申请';
          btn.textContent = '已申请';
        } else {
          status.className = 'status err';
          status.textContent = '当前环境无法发起申请';
          btn.disabled = false;
        }
      } catch (e) {
        status.className = 'status err';
        status.textContent = '提交失败：' + (e && e.message ? e.message : e);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
