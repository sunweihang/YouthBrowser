<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>下载</title>
  <link rel="stylesheet" href="../history/styles.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand-row">
        <span class="brand">简行浏览器</span>
        <span class="app-version" id="appVersion">v—</span>
      </div>
      <h1>下载</h1>
    </div>
    <div class="actions">
      <input id="searchInput" type="search" placeholder="搜索文件名" autocomplete="off" spellcheck="false" />
      <button type="button" id="openFolderBtn">下载文件夹</button>
      <button type="button" class="danger" id="clearBtn">清空列表</button>
    </div>
  </header>

  <div id="list" class="list"></div>
  <p id="empty" class="empty hidden">还没有下载记录。</p>

  <script src="app.js"></script>
</body>
</html>
