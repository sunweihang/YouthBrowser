<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简行浏览器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="chrome">
    <div class="tabs" id="tabs"></div>
    <button type="button" class="icon-btn" id="newTab" title="新标签页">+</button>
  </header>
  <div class="toolbar">
    <button type="button" class="icon-btn" id="back" title="后退" disabled>←</button>
    <button type="button" class="icon-btn" id="forward" title="前进" disabled>→</button>
    <button type="button" class="icon-btn" id="reload" title="刷新">↻</button>
    <form id="navForm" class="url-form">
      <input id="urlInput" type="text" spellcheck="false" autocomplete="off" placeholder="输入已授权的网址" />
    </form>
    <button type="button" class="icon-btn star-btn" id="bookmarkBtn" title="收藏本页">☆</button>
    <button type="button" class="icon-btn menu-btn" id="downloadsBtn" title="下载" aria-label="下载">
      ↓
      <span class="update-badge hidden" id="downloadsBadge"></span>
    </button>
    <button type="button" class="icon-btn menu-btn" id="menuBtn" title="打开菜单" aria-label="打开菜单">
      <span class="menu-icon" aria-hidden="true"></span>
      <span class="update-badge hidden" id="updateBadge"></span>
    </button>
  </div>
  <div class="bookmarks" id="bookmarksBar">
    <div class="bookmarks-items" id="bookmarksItems"></div>
  </div>
  <div class="find-bar hidden" id="passwordBar">
    <span class="find-label" id="passwordBarText">保存密码？</span>
    <button type="button" class="primary" id="passwordSave">保存</button>
    <button type="button" id="passwordDismiss">不保存</button>
    <button type="button" class="update-close" id="passwordClose" title="关闭">×</button>
  </div>
  <form class="find-bar hidden" id="homepageBar" autocomplete="off">
    <label class="find-label" for="homepageInput">主页</label>
    <input id="homepageInput" type="text" spellcheck="false" placeholder="https://" />
    <span class="find-count" id="homepageError"></span>
    <button type="button" id="homepageUseCurrent">当前页</button>
    <button type="button" id="homepageClear">清除</button>
    <button type="submit" class="primary" id="homepageSave">保存</button>
    <button type="button" class="update-close" id="homepageClose" title="关闭">×</button>
  </form>
  <div class="find-bar hidden" id="downloadBar">
    <span class="find-label" id="downloadBarText">下载</span>
    <span class="find-count" id="downloadBarMeta"></span>
    <button type="button" class="primary" id="downloadBarOpen">打开</button>
    <button type="button" id="downloadBarShow">文件夹</button>
    <button type="button" id="downloadBarList">查看全部</button>
    <button type="button" class="update-close" id="downloadBarClose" title="关闭">×</button>
  </div>
  <div class="find-bar hidden" id="findBar">
    <label class="find-label" for="findInput">查找</label>
    <input id="findInput" type="text" spellcheck="false" autocomplete="off" placeholder="在页面中查找" />
    <span class="find-count" id="findCount"></span>
    <button type="button" class="icon-btn" id="findPrev" title="上一个">↑</button>
    <button type="button" class="icon-btn" id="findNext" title="下一个">↓</button>
    <button type="button" class="update-close" id="findClose" title="关闭">×</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
